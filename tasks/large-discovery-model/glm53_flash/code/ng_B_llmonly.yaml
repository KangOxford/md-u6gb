# B 组:LLM-only 反思基准 —— 同模型、同预算、同起点,只是没有 GP 引导。
# 真评测次数与 A 组逐次相同(breadth=1 depth=1,每轮 1 次真训练),
# 每轮恰好 1 次真训练,与论文提交的 real_operation_tool_best_of_n 形状一致
# (论文实测「100 次迭代中 99 个外层候选进入真训练」)。
name: ng_B_llmonly_glm53
task: nanogpt
algorithm: best_of_n
mode: real
contract_profile: repro_llmonly_arm
description: LLM-only reflection arm - identical budget, no GP acquisition feedback.
args:
  train-file: resources/train/real_train.py
  operation-schema: resources/schemas/real_operations.json
  generator: operation_tool
  method: best_of_n
  breadth: 1
  depth: 1
  iterations: 40
  warmup: 5
  seed-policy: best
  acquisition-feedback: none       # ← 唯一差别:GP 引导关
  acquisition-feedback-probes: 96
  initial-expansion-parameters: 5
  max-expansion-parameters: 0
  disable-expansion-schema-updates: false
  allow-new-expansion-parameters: false
  surrogate-mode: lcb
  gp-beta: 1.0
  gp-xi: 0.001
  out-dir: runs
  run-name: "{name}"
  eval-command: "/home/u6gb/kangli.u6gb/envs/ldm-nanogpt/bin/python {train_path}"
  llm-url: null
  llm-model-name: null
  api-key: null
  temperature: 0.7
  max-tokens: 8192
