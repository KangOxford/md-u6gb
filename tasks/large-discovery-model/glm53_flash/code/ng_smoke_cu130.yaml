# A 组:LDM 完整回路 —— GP 代理把预测与不确定性喂回提案(acquisition-feedback)
# 与 B 组的差别**只有这一项**。真评测预算逐次对齐:breadth=1 depth=1 ⇒
# 每轮恰好 1 次真训练,与论文提交的 real_operation_tool_best_of_n 形状一致
# (论文实测「100 次迭代中 99 个外层候选进入真训练」)。
name: ng_smoke_cu130
task: nanogpt
algorithm: best_of_n
mode: real
contract_profile: repro_smoke
description: LDM arm - GP acquisition feedback steers GLM-5.3-Flash proposals.
args:
  train-file: resources/train/real_train.py
  operation-schema: resources/schemas/real_operations.json
  generator: operation_tool
  method: best_of_n
  breadth: 1
  depth: 1
  iterations: 2
  warmup: 2
  seed-policy: best
  acquisition-feedback: brief      # ← 唯一差别:GP 引导开
  acquisition-feedback-probes: 96
  initial-expansion-parameters: 5
  max-expansion-parameters: 0
  disable-expansion-schema-updates: false
  allow-new-expansion-parameters: false
  surrogate-mode: lcb
  gp-beta: 1.0
  gp-xi: 0.001
  out-dir: runs
  run-name: "{name}"
  eval-command: "/home/u6gb/kangli.u6gb/envs/ldm-nanogpt/bin/python {train_path}"
  llm-url: null
  llm-model-name: null
  api-key: null
  temperature: 0.7
  max-tokens: 8192
